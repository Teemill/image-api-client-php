name: Check & fix styling

on: [push]

permissions:
  contents: read

jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    permissions:
      contents: write # git-auto-commit-action pushes the styling fixes

    steps:
      # Credentials stay persisted: git-auto-commit-action pushes with them.
      - name: Checkout code # zizmor: ignore[artipacked]
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          ref: ${{ github.head_ref }}

      - name: Run PHP CS Fixer
        # latest as of 2026-10-05 (PHP CS Fixer 3.95.27); the image has no newer version tags
        uses: docker://oskarstark/php-cs-fixer-ga@sha256:1705cc5e175e559ed0ca8c2942cf0fef8b7e68b23b04ef894600714e884f1fe4
        with:
          args: --config=.php-cs-fixer.dist.php --allow-risky=yes

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@3ea6ae190baf489ba007f7c92608f33ce20ef04a # v4.16.0
        with:
          commit_message: Fix styling
